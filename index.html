<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>CBT Trigonometri XI</title>

<style>
body{
font-family:Arial;
max-width:1000px;
margin:auto;
padding:20px;
background:#f5f5f5;
}

h1{
text-align:center;
}

.soal{
background:white;
padding:15px;
margin:10px 0;
border-radius:10px;
box-shadow:0 0 5px rgba(0,0,0,0.2);
}

button{
padding:15px 30px;
font-size:18px;
background:#2196f3;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

#hasil{
font-size:24px;
font-weight:bold;
margin-top:20px;
}
</style>

</head>
<body>

<h1>CBT Trigonometri Kelas XI</h1>

<form id="quiz"></form>

<center>
<button onclick="cek();return false;">
Selesai & Periksa Nilai
</button>
</center>

<div id="hasil"></div>
<div id="kunci"></div>

<script>

const soal=[

["Sin 60° =",["1/2","√2/2","√3/2","1"],2],
["Cos 120° =",["1/2","-1/2","√3/2","-√3/2"],1],
["Tan 45° =",["0","1","√3","1/2"],1],
["60° dalam radian =",["π/6","π/4","π/3","π/2"],2],
["3π/4 rad =",["120°","135°","150°","180°"],1],
["Sec 60° =",["1","2","√2","√3"],1],
["Csc 30° =",["1","2","√2","√3"],1],
["Sin 210° =",["1/2","-1/2","√3/2","-√3/2"],1],
["Cos 330° =",["√3/2","-√3/2","1/2","-1/2"],0],
["Koordinat sudut 60° =",["(1/2,√3/2)","(√3/2,1/2)","(1,0)","(0,1)"],1],
["150° dalam radian =",["5π/6","π/6","π/4","π"],0],
["π/3 rad =",["30°","45°","60°","90°"],2],
["Amplitudo y=5sinx =",["1","3","5","10"],2],
["Periode y=sin2x =",["π","2π","4π","π/2"],0],
["Maksimum y=10+5sinx =",["5","10","15","20"],2],
["Maksimum y=3cosx+4 =",["4","5","6","7"],3],
["Minimum y=4sinx-2 =",["-6","-4","-2","2"],0],
["Puncak pertama grafik y=sinx terjadi pada =",["0°","30°","45°","90°"],3],
["Cot 45° =",["1","2","0","√2"],0],
["Sec 0° =",["0","1","2","tidak terdefinisi"],1],
["Sin 120° =",["√3/2","1/2","-1/2","-√3/2"],0],
["Cos 240° =",["-1/2","1/2","√3/2","-√3/2"],0],
["Tan 135° =",["1","-1","√3","-√3"],1],
["Aturan sinus digunakan untuk =",["Segitiga sembarang","Lingkaran","Kubus","Balok"],0],
["Aturan cosinus digunakan untuk mencari =",["Luas lingkaran","Sisi segitiga","Volume kubus","Keliling persegi"],1]

];

let form=document.getElementById("quiz");

for(let i=0;i<soal.length;i++){

let html=`
<div class="soal">
<b>${i+1}. ${soal[i][0]}</b><br><br>
`;

for(let j=0;j<soal[i][1].length;j++){

html+=`
<label>
<input type="radio" name="q${i}" value="${j}">
${soal[i][1][j]}
</label><br>
`;

}

html+=`</div>`;

form.innerHTML+=html;
}

function cek(){

let benar=0;

for(let i=0;i<soal.length;i++){

let pilih=document.querySelector(`input[name=q${i}]:checked`);

if(pilih){

if(parseInt(pilih.value)==soal[i][2]){

benar++;

}

}

}

let nilai=(benar/25*100).toFixed(0);

document.getElementById("hasil").innerHTML=
`
Nilai Anda : ${nilai}<br>
Benar : ${benar}/25
`;

let kunci="<h2>Kunci Jawaban</h2>";

for(let i=0;i<soal.length;i++){

let huruf=["A","B","C","D"];

kunci+=`
${i+1}. ${huruf[soal[i][2]]}<br>
`;

}

document.getElementById("kunci").innerHTML=kunci;

window.scrollTo(0,document.body.scrollHeight);

}

</script>

</body>
</html>
